<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">codex-tg-wire</title>
  <desc id="desc">A durable wire connecting Telegram, SQLite and Codex App Server.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="blue-glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <filter id="wire-glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#background)" stroke="#334155" stroke-opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="418" rx="28" fill="url(#grid)"/>
  <ellipse cx="150" cy="205" rx="280" ry="250" fill="url(#blue-glow)"/>
  <ellipse cx="1050" cy="210" rx="300" ry="250" fill="url(#violet-glow)"/>

  <text x="600" y="71" text-anchor="middle" fill="#f8fafc" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="750" letter-spacing="1.5">codex-tg-wire</text>
  <text x="600" y="103" text-anchor="middle" fill="#94a3b8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" letter-spacing="0.6">YOUR CODEX WORKSPACE · IN TELEGRAM · WITHOUT THE FRAGILE PARTS</text>

  <path d="M285 241C385 241 404 198 493 198H707C796 198 815 241 915 241" fill="none" stroke="#020617" stroke-opacity="0.7" stroke-width="13"/>
  <path d="M285 241C385 241 404 198 493 198H707C796 198 815 241 915 241" fill="none" stroke="url(#wire)" stroke-width="4" stroke-linecap="round" filter="url(#wire-glow)"/>
  <circle cx="382" cy="223" r="5" fill="#38bdf8"/>
  <circle cx="818" cy="223" r="5" fill="#a78bfa"/>

  <g filter="url(#shadow)">
    <rect x="98" y="153" width="190" height="174" rx="24" fill="#0f1b2d" stroke="#38bdf8" stroke-opacity="0.65"/>
    <circle cx="193" cy="205" r="34" fill="#38bdf8" fill-opacity="0.14" stroke="#38bdf8" stroke-opacity="0.72"/>
    <path d="M174 205l39-16-11 38-10-12-8 8-2-14z" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linejoin="round"/>
    <text x="193" y="268" text-anchor="middle" fill="#e2e8f0" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="650">Telegram</text>
    <text x="193" y="293" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12">private owner chat</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="442" y="148" width="316" height="182" rx="24" fill="#0b1d25" stroke="#2dd4bf" stroke-opacity="0.68"/>
    <rect x="471" y="174" width="258" height="52" rx="13" fill="#102b31" stroke="#2dd4bf" stroke-opacity="0.38"/>
    <circle cx="497" cy="200" r="7" fill="#2dd4bf"/>
    <text x="518" y="205" fill="#ccfbf1" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" font-weight="650">durable inbox</text>
    <rect x="471" y="239" width="258" height="52" rx="13" fill="#102b31" stroke="#2dd4bf" stroke-opacity="0.38"/>
    <circle cx="497" cy="265" r="7" fill="#fbbf24"/>
    <text x="518" y="270" fill="#ccfbf1" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" font-weight="650">durable outbox</text>
    <rect x="526" y="307" width="148" height="28" rx="14" fill="#042f2e" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="600" y="326" text-anchor="middle" fill="#5eead4" font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">SQLite · WAL</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="912" y="153" width="190" height="174" rx="24" fill="#17152a" stroke="#a78bfa" stroke-opacity="0.7"/>
    <rect x="941" y="179" width="132" height="67" rx="13" fill="#201d39" stroke="#a78bfa" stroke-opacity="0.42"/>
    <circle cx="959" cy="196" r="4" fill="#fb7185"/>
    <circle cx="973" cy="196" r="4" fill="#fbbf24"/>
    <circle cx="987" cy="196" r="4" fill="#34d399"/>
    <path d="M959 218l10 8-10 8M978 234h27" fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1007" y="268" text-anchor="middle" fill="#ede9fe" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="19" font-weight="650">Codex</text>
    <text x="1007" y="292" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace,SFMono-Regular,monospace" font-size="12">App Server · stdio</text>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="11">
    <rect x="242" y="355" width="180" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="332" y="375" text-anchor="middle" fill="#94a3b8">restart-safe threads</text>
    <rect x="510" y="355" width="180" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="600" y="375" text-anchor="middle" fill="#94a3b8">honest delivery state</text>
    <rect x="778" y="355" width="180" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="868" y="375" text-anchor="middle" fill="#94a3b8">no tmux · no mirror</text>
  </g>
</svg>
