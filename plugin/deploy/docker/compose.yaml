name: codex-tg-wire

x-build-args: &build-args
  BUN_VERSION: ${BUN_VERSION:-1.4.0}
  CODEX_CLI_VERSION: ${CODEX_CLI_VERSION:-0.149.1}
  CODEX_TG_WIRE_UID: ${CODEX_TG_WIRE_IMAGE_UID:-10001}
  CODEX_TG_WIRE_GID: ${CODEX_TG_WIRE_IMAGE_GID:-10001}
  VERSION: ${CODEX_TG_WIRE_VERSION:-1.0.0}
  REVISION: ${CODEX_TG_WIRE_REVISION:-unknown}

x-container-security: &container-security
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,mode=1777

services:
  bridge:
    image: ${CODEX_TG_WIRE_IMAGE:-codex-tg-wire:1.0.0}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args: *build-args
    init: true
    restart: unless-stopped
    user: "${CODEX_TG_WIRE_UID:?run ./docker.sh setup}:${CODEX_TG_WIRE_GID:?run ./docker.sh setup}"
    env_file:
      - ${CODEX_TG_WIRE_CONFIG_DIR:?run ./docker.sh setup}/bridge.env
    environment:
      HOME: /var/lib/codex
      CODEX_HOME: /var/lib/codex
      DASHI_CODEX_BRIDGE_CONFIG: /etc/codex-tg-wire/bridge.config.json
      CODEX_TG_WIRE_BOOTSTRAP_FILE: /etc/codex-tg-wire/bootstrap-state.json
      DASHI_TELEGRAM_BOT_TOKEN_FILE: /etc/codex-tg-wire/telegram-token
    volumes:
      - type: bind
        source: ${CODEX_TG_WIRE_CONFIG_DIR:?run ./docker.sh setup}
        target: /etc/codex-tg-wire
        # Bot-first bootstrap atomically persists its cursor and final config.
        # The host directory remains private (0700; files 0600).
        read_only: false
      - type: bind
        source: ${CODEX_TG_WIRE_PROJECT_PATH:?run ./docker.sh setup}
        target: ${CODEX_TG_WIRE_PROJECT_PATH:?run ./docker.sh setup}
      - type: bind
        source: ${CODEX_TG_WIRE_STATE_DIR:?run ./docker.sh setup}
        target: /var/lib/codex-tg-wire
      - type: bind
        source: ${CODEX_TG_WIRE_CODEX_HOME:?run ./docker.sh setup}
        target: /var/lib/codex
    <<: *container-security
    stop_grace_period: 2m

  # One-shot config generator. It is profile-gated, so a normal `compose up`
  # never starts it. docker.sh passes only non-secret values as arguments.
  setup:
    profiles: ["setup"]
    image: ${CODEX_TG_WIRE_IMAGE:-codex-tg-wire:1.0.0}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runtime
      args: *build-args
    user: "${CODEX_TG_WIRE_UID:?run ./docker.sh setup}:${CODEX_TG_WIRE_GID:?run ./docker.sh setup}"
    environment:
      HOME: /var/lib/codex
      CODEX_HOME: /var/lib/codex
    volumes:
      - type: bind
        source: ${CODEX_TG_WIRE_CONFIG_DIR:?run ./docker.sh setup}
        target: /etc/codex-tg-wire
      - type: bind
        source: ${CODEX_TG_WIRE_PROJECT_PATH:?run ./docker.sh setup}
        target: ${CODEX_TG_WIRE_PROJECT_PATH:?run ./docker.sh setup}
        read_only: true
      - type: bind
        source: ${CODEX_TG_WIRE_STATE_DIR:?run ./docker.sh setup}
        target: /var/lib/codex-tg-wire
      - type: bind
        source: ${CODEX_TG_WIRE_CODEX_HOME:?run ./docker.sh setup}
        target: /var/lib/codex
    entrypoint: ["bun", "run", "init:codex", "--"]
    command: ["--help"]
    <<: *container-security

  # One-shot official Codex CLI login. The helper is profile-gated and stores
  # auth in the same host CODEX_HOME used by the bridge and local Codex CLI.
  codex-login:
    profiles: ["setup"]
    image: ${CODEX_TG_WIRE_LOGIN_IMAGE:-codex-tg-wire-login:1.0.0}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: login
      args: *build-args
    user: "${CODEX_TG_WIRE_UID:?run ./docker.sh setup}:${CODEX_TG_WIRE_GID:?run ./docker.sh setup}"
    environment:
      HOME: /var/lib/codex
      CODEX_HOME: /var/lib/codex
    volumes:
      - type: bind
        source: ${CODEX_TG_WIRE_CODEX_HOME:?run ./docker.sh setup}
        target: /var/lib/codex
    ports:
      - "127.0.0.1:1455:1456"
    <<: *container-security
